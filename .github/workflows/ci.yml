name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node のメジャーは .nvmrc で一元管理する。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format export
        run: |
          npx prettier --write .
          for f in \
            src/content/data/fishing-spots/alaska-coastal-bay.json \
            src/content/data/fishing-spots/arakawa-lower.json \
            src/content/data/fishing-spots/brackish-mouth.json \
            src/content/data/fishing-spots/forest-reservoir-arm.json \
            src/content/data/fishing-spots/hokkaido-coast.json \
            src/content/data/fishing-spots/tama-river-lower.json \
            src/domain/casting/Casting.test.ts \
            src/domain/casting/Casting.ts \
            src/domain/encounter/encounterEngine.test.ts \
            src/domain/encounter/encounterEngine.ts \
            src/ui/fishing/FishingScreen.tsx \
            src/ui/fishing/useFishingSession.ts
          do
            echo "::FORMAT_FILE::$f"
            base64 -w0 "$f"
            echo
          done
          exit 1

      - name: Validate content
        run: npm run validate:content

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
