name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node のメジャーは .nvmrc で一元管理する。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # 検証では書き換えない。整形の確認のみを行う。
      - name: Format check
        run: npm run format:check

      - name: Validate content
        run: npm run validate:content

      # 生成物（project map / authority map）の鮮度と整合を検査する。
      - name: Dev infrastructure
        run: |
          chmod +x dev
          ./dev authority --check
          ./dev map --check
          ./dev save-check
          ./dev smoke

      - name: Regional content audit
        run: npm run simulate:regional-content

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
