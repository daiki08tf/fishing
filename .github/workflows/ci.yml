name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node のメジャーは .nvmrc で一元管理する。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Export formatted files
        run: |
          npx prettier --write .
          git diff --name-only > /tmp/formatted-files.txt
          while IFS= read -r f; do
            echo "::FORMAT_FILE::$f"
            base64 -w0 "$f"
            echo
          done < /tmp/formatted-files.txt
          exit 1

      - name: Validate content
        run: npm run validate:content

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
