name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node のメジャーは .nvmrc で一元管理する。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # 検証では書き換えない。整形の確認のみを行う。
      - name: Export formatted files
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import path from 'node:path'
          const dir = 'src/content/data/fish-species'
          for (const name of fs.readdirSync(dir).filter((entry) => entry.endsWith('.json'))) {
            const file = path.join(dir, name)
            const data = JSON.parse(fs.readFileSync(file, 'utf8'))
            data.methodAffinity ??= { lure: 1, light_lure: 1, bait: 1, bottom: 1 }
            data.offeringAffinity ??= { minnow: 1, soft_plastic: 1, worm: 1, mid: 1, small: 1 }
            fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n')
          }
          NODE
          npx prettier --write .
          git diff --name-only > /tmp/formatted-files.txt
          while IFS= read -r f; do
            echo "::FORMAT_FILE::$f"
            base64 -w0 "$f"
            echo
          done < /tmp/formatted-files.txt

      - name: Validate content
        run: npm run validate:content

      - name: Regional content audit
        run: npm run simulate:regional-content

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
