<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fishing Content Studio</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Content Studio</h1>
        <span id="status"></span>
        <button id="reload" title="ディスクから Content を読み直す">reload</button>
      </header>
      <div class="layout">
        <nav id="kinds"></nav>
        <aside id="list-pane">
          <input id="search" type="search" placeholder="id / name で検索" autocomplete="off" />
          <div class="list-actions"><button id="new-record">+ new</button></div>
          <ul id="records"></ul>
        </aside>
        <main id="detail">
          <p class="placeholder">左から kind とレコードを選ぶ</p>
        </main>
      </div>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
